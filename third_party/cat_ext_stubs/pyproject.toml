[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-ext-stubs"
version = "0.1.0"
description = "Import-only stubs for CAT's compiled extensions that the CTC training path imports but never calls."

[tool.setuptools]
packages = ["ctcdecode", "gather", "warp_rnnt"]
